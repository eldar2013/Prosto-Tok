name: Import MargyT source snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - work/prostotok-margyt-adaptation
    paths:
      - .github/workflows/import-margyt-source.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Prosto Tok working branch
        uses: actions/checkout@v4
        with:
          ref: work/prostotok-margyt-adaptation
          fetch-depth: 0
      - name: Fetch exact MargyT archive revision from its upstream host
        run: |
          git init upstream-margyt
          git -C upstream-margyt remote add origin https://git.narez.xyz/narezany/MargyT
          git -C upstream-margyt fetch --depth=1 origin a0089402f266a67700432fdb56a36fe7e45da6a3
          git -C upstream-margyt checkout --detach FETCH_HEAD
      - name: Import complete source snapshot
        run: |
          mkdir -p vendor/margyt
          rsync -a --delete --exclude='.git' upstream-margyt/ vendor/margyt/
      - name: Commit imported upstream snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/margyt
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git commit -m "Import MargyT source snapshot a008940"
          git push origin HEAD:work/prostotok-margyt-adaptation
