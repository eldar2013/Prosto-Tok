name: Import MargyT source snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - work/prostotok-margyt-adaptation
    paths:
      - .github/workflows/import-margyt-source.yml
      - MargyT-main.zip

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Prosto Tok working branch
        uses: actions/checkout@v4
        with:
          ref: work/prostotok-margyt-adaptation
          fetch-depth: 0
      - name: Validate and extract uploaded MargyT archive
        run: |
          test -f MargyT-main.zip
          python3 - <<'PY'
          import zipfile
          archive = zipfile.ZipFile("MargyT-main.zip")
          expected = "a0089402f266a67700432fdb56a36fe7e45da6a3"
          actual = archive.comment.decode("ascii").strip()
          if actual != expected:
              raise SystemExit(f"Unexpected MargyT archive revision: {actual!r}")
          archive.extractall("upstream-extracted")
          PY
          test -f upstream-extracted/margyt/README.md
          mkdir -p vendor/margyt
          rsync -a --delete upstream-extracted/margyt/ vendor/margyt/
      - name: Commit imported upstream snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A vendor/margyt
          git rm --ignore-unmatch MargyT-main.zip
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git commit -m "Import MargyT source snapshot a008940"
          git push origin HEAD:work/prostotok-margyt-adaptation
